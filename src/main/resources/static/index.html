<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Chat Test</title>
  <!-- SockJS and STOMP libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    input { width: 70%; padding: 8px; }
    button { padding: 8px 16px; margin-left: 5px; }
    .status { color: green; font-weight: bold; }
  </style>
</head>
<body>
<h2>WebSocket Chat</h2>
<p>Status: <span id="status" class="status">Disconnected</span></p>

<div>
  <input type="text" id="username" placeholder="Your name" value="Gina"/>
  <button onclick="connect()">Connect</button>
  <button onclick="disconnect()">Disconnect</button>
</div>
<br/>

<div id="messages"></div>

<div>
  <input type="text" id="messageInput" placeholder="Type a message..."/>
  <button onclick="sendMessage()">Send</button>
</div>

<script>
  let stompClient = null;

  function connect() {
    const username = document.getElementById('username').value;
    const socket = new SockJS('http://localhost:8080/ws');
    stompClient = Stomp.over(socket);

    stompClient.connect({}, function(frame) {
      document.getElementById('status').innerText = 'Connected ✅';

      // Subscribe to broadcast messages
      stompClient.subscribe('/topic/messages', function(message) {
        showMessage(JSON.parse(message.body));
      });

      // Announce joining
      stompClient.send('/app/join', {}, JSON.stringify({
        sender: username,
        type: 'JOIN'
      }));
    });
  }

  function disconnect() {
    if (stompClient) {
      const username = document.getElementById('username').value;
      stompClient.send('/app/leave', {}, JSON.stringify({
        sender: username,
        type: 'LEAVE'
      }));
      stompClient.disconnect();
      document.getElementById('status').innerText = 'Disconnected';
    }
  }

  function sendMessage() {
    const username = document.getElementById('username').value;
    const content = document.getElementById('messageInput').value;
    if (stompClient && content) {
      stompClient.send('/app/chat', {}, JSON.stringify({
        sender: username,
        content: content,
        type: 'CHAT'
      }));
      document.getElementById('messageInput').value = '';
    }
  }

  function showMessage(message) {
    const div = document.getElementById('messages');
    const p = document.createElement('p');
    if (message.type === 'JOIN' || message.type === 'LEAVE') {
      p.style.color = 'gray';
      p.style.fontStyle = 'italic';
      p.innerText = message.content;
    } else {
      p.innerText = `[${new Date().toLocaleTimeString()}] ${message.sender}: ${message.content}`;
    }
    div.appendChild(p);
    div.scrollTop = div.scrollHeight;
  }

  // Send on Enter key
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
</script>
</body>
</html>
