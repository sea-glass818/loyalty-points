spring:
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:h2:mem:loyaltydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop  # ← create schema from entities, drop after test
    defer-datasource-initialization: true  # ← wait for schema before data.sql
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null

loyalty:
  points-expire-after-months: 12
